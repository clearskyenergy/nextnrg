<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects — NextNRG</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cs-navy:#08384F;--cs-dark:#052A3D;--cs-blue:#006F9A;--cs-sky:#00A9A4;
  --cs-accent:#00A9A4;--cs-gold:#00C4BC;--cs-text:#0F2733;--cs-sub:#5A7180;
  --cs-bg:#F4F1EC;--cs-surface:#FAFAF8;--cs-border:#DDD8D0;--cs-red:#E53935;
  --sap-blue:#0070F2;--sap-blue-hi:#1B90FF;--sap-page:#EDEFF1;--sap-card-border:#E4E8EC;
}
/* Repoint the page chrome onto SAP tokens, exactly like the portal index. */
body{--cs-bg:var(--sap-page);--cs-border:var(--sap-card-border)}
body{font-family:'DM Sans',sans-serif;background:var(--cs-bg);color:var(--cs-text);min-height:100vh}
#topbar{display:flex;align-items:center;gap:0;background:#fff;color:var(--sap-ink);padding:0 24px;height:60px;position:sticky;top:0;z-index:200;border-bottom:1px solid var(--sap-card-border);box-shadow:0 1px 2px rgba(20,40,60,.04)}
.tb-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.tb-omega{height:22px;width:auto;display:block;background:var(--sap-blue);border-radius:5px;padding:5px 7px}
.tb-logo-txt{color:var(--sap-ink);font-weight:700;font-size:15px;letter-spacing:-.2px}
.tb-logo-txt span{color:var(--sap-blue)}
.tb-sep{width:1px;height:22px;background:var(--sap-card-border);margin:0 16px}
.tb-portal{color:var(--sap-ink-2);font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tb-client{display:flex;align-items:center;gap:9px;margin-left:16px}
.tb-client-chip{background:#fff;border:1px solid var(--sap-card-border);border-radius:7px;padding:4px 8px;display:flex;align-items:center;height:32px}
.tb-client-chip img{height:22px;width:auto;display:block}
.tb-client-txt{font-size:13px;font-weight:700;color:var(--cs-navy);letter-spacing:-.2px;white-space:nowrap}
.tb-ent-badge{font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--sap-ink-2);background:transparent;border:none;padding:0;white-space:nowrap}
.tb-nav{display:flex;align-items:center;gap:2px;margin-left:20px;height:56px}
.tb-tab{display:flex;align-items:center;gap:6px;text-decoration:none;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--sap-ink);border-radius:0;padding:0 14px;height:56px;cursor:pointer;font:500 13.5px/1 'DM Sans',sans-serif;white-space:nowrap;transition:color .12s,border-color .12s}
.tb-tab svg{width:15px;height:15px;flex:none;opacity:.7}
.tb-tab:hover{color:var(--sap-blue)}
.tb-tab.active{color:var(--sap-blue);border-bottom-color:var(--sap-blue-hi);font-weight:600}
.tb-tab.active svg{opacity:1}
.tb-spacer{flex:1}
.tb-user{display:flex;align-items:center;gap:10px}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--sap-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.tb-name{color:var(--sap-ink);font-size:13px;font-weight:500}
.btn-signout{background:#fff;border:1px solid var(--sap-card-border);color:var(--sap-ink-2);border-radius:6px;padding:6px 13px;cursor:pointer;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .12s}
.btn-signout:hover{border-color:var(--sap-blue);color:var(--sap-blue)}
.btn-new{background:var(--sap-blue);border:none;color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;font:600 12px 'DM Sans',sans-serif;transition:background .12s}
.btn-new:hover{background:var(--sap-blue-hi)}
#main{max-width:1000px;margin:0 auto;padding:40px 24px}
.page-title{font-size:28px;font-weight:700;color:var(--cs-navy);letter-spacing:-.3px}
.page-sub{font-size:14px;color:var(--cs-sub);margin-top:4px}
.toolbar{display:flex;gap:10px;margin:24px 0;align-items:center}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;border:1.5px solid var(--cs-border);border-radius:9px;padding:9px 12px 9px 36px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--cs-text);outline:none}
.search-wrap input:focus{border-color:var(--cs-sky)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
select.sort-sel{border:1.5px solid var(--cs-border);border-radius:9px;padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--cs-text);outline:none;cursor:pointer}
.proj-table{background:#fff;border:1px solid var(--cs-border);border-radius:12px;overflow:hidden}
.pt-head{display:grid;grid-template-columns:1fr 190px 100px 90px 60px;padding:12px 16px;border-bottom:1px solid var(--cs-border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--cs-sub)}
.pt-row{display:grid;grid-template-columns:1fr 190px 100px 90px 60px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.04);align-items:center;cursor:pointer;transition:background .1s}
.pt-row:hover{background:#F8F9FA}
.pt-row:last-child{border-bottom:none}
.pt-name{font-size:14px;font-weight:600;color:var(--cs-navy)}
.pt-addr{font-size:11px;color:var(--cs-sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-type{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;background:rgba(0,111,154,.1);color:var(--cs-blue);display:inline-block}
.pt-date{font-size:12px;color:var(--cs-sub)}
.pt-del{background:none;border:none;cursor:pointer;color:var(--cs-border);font-size:16px;padding:4px}
.pt-del:hover{color:var(--cs-red)}
.pt-owner{display:flex;align-items:center;gap:8px;min-width:0}
.owner-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#EEF1F4;color:var(--cs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.owner-chip.owner-me{background:rgba(0,169,164,.14);color:#00736F}
.owner-chip.owner-none{background:rgba(217,119,6,.12);color:#B45309}
.pt-owner-link{color:var(--cs-sub);display:inline-flex;align-items:center}
.pt-owner-link svg{width:14px;height:14px}
.pt-owner-link:hover{color:var(--sap-blue)}
.empty{text-align:center;padding:60px;color:var(--cs-sub)}
.empty svg{opacity:.3;margin-bottom:12px}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:10px;color:var(--cs-sub)}
.spin{width:18px;height:18px;border:2px solid var(--cs-border);border-top-color:var(--cs-sky);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.pt-head,.pt-row{grid-template-columns:1fr 110px 40px}.pt-head span:nth-child(3),.pt-head span:nth-child(4),.pt-row>div:nth-child(3),.pt-row>div:nth-child(4){display:none}}
/* ══════════════════════ MOBILE ══════════════════════ */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}

/* Drawer-only controls hidden on desktop; shown in the mobile drawer below. */
.tb-drawer-who,.tb-drawer-actions{display:none}

.tb-burger{display:none;background:#fff;border:1px solid var(--sap-card-border,#E4E8EC);border-radius:8px;
  width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.tb-burger svg{width:20px;height:20px;stroke:var(--sap-ink,#1D2D3E);stroke-width:2;fill:none;stroke-linecap:round}
.tb-scrim{position:fixed;inset:0;background:rgba(8,25,40,.5);z-index:999;opacity:0;pointer-events:none;
  transition:opacity .2s}
.tb-scrim.open{opacity:1;pointer-events:auto}

@media (max-width:900px){
  #topbar{height:54px;padding:0 12px;gap:8px}
  .tb-burger{display:flex}
  .tb-sep,.tb-portal,.tb-ent-badge{display:none}
  .tb-client{margin-left:0;min-width:0}
  .tb-client-chip{height:30px;padding:3px 7px;max-width:150px;overflow:hidden}
  .tb-client-chip img{height:20px}
  .tb-client-txt{font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .tb-name{display:none}

  .tb-nav{position:fixed !important;top:0 !important;right:0;bottom:0;left:auto;
    width:270px;max-width:82vw;height:100vh;height:100dvh;
    background:#ffffff !important;background-color:#ffffff !important;
    flex-direction:column;align-items:stretch;gap:0;margin:0;padding:64px 0 20px;
    box-shadow:-8px 0 30px rgba(0,0,0,.28);transform:translateX(100%);transition:transform .24s ease;
    z-index:1000 !important;overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:1 !important;backdrop-filter:none}
  .tb-nav.open{transform:translateX(0)}
  .tb-tab{height:auto;padding:15px 22px;border-bottom:1px solid var(--sap-card-border,#E4E8EC);
    border-left:3px solid transparent;font-size:15px;justify-content:flex-start;gap:12px}
  .tb-tab.active{border-bottom-color:var(--sap-card-border,#E4E8EC);border-left-color:var(--sap-blue,#0070F2);
    background:rgba(0,112,242,.06)}
  .tb-tab svg{width:18px;height:18px}
  .tb-nav .tb-drawer-actions{padding:16px 22px;display:flex;flex-direction:column;gap:10px}
  .tb-nav .tb-drawer-actions button{width:100%;padding:12px;font-size:14px;border-radius:9px}
  .tb-nav .tb-drawer-who{display:block;padding:0 22px 12px;font-size:12px;color:var(--sap-ink-2,#556B82);
    word-break:break-all;border-bottom:1px solid var(--sap-card-border,#E4E8EC);margin-bottom:14px}
  .tb-user .btn-signout{display:none}
  .tb-spacer{flex:1}
}

@media (max-width:900px){
  #main{padding:24px 14px 48px}
  .page-title{font-size:23px}
  .page-sub{font-size:13px}
  .toolbar{flex-wrap:wrap;gap:8px;margin:18px 0}
  .search-wrap{flex:1 1 100%}
  .search-wrap input{font-size:16px;padding:12px 12px 12px 36px}
  select.sort-sel{flex:1;font-size:15px;padding:11px 12px}
  .btn-new{padding:11px 16px;font-size:13px}
}
@media (max-width:600px){
  #main{padding:20px 12px 44px}
  .page-title{font-size:20px}
  .toolbar > *{min-width:0}
  select.sort-sel{flex:1 1 100%}
  .btn-new{width:100%;padding:13px}
  .pt-head,.pt-row{padding:12px 12px}
}

/* ── NEW PROJECT MODAL (projects page) ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:30px;width:460px;max-width:94vw;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal h3{font-size:20px;font-weight:700;color:var(--cs-navy,#08384F);margin-bottom:20px}
.mrow{margin-bottom:14px}
.mrow label{display:block;font-size:11px;color:var(--cs-sub,#5A7180);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mrow input,.mrow select{width:100%;border:1.5px solid var(--cs-border,#DDD8D0);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--cs-text,#0F2733);background:#fff;outline:none;transition:border-color .12s}
.mrow input:focus,.mrow select:focus{border-color:var(--cs-sky,#00A9A4)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.mb-cancel{background:#F4F1EC;border:1px solid var(--cs-border,#DDD8D0);color:var(--cs-sub,#5A7180);border-radius:8px;padding:9px 18px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif}
.mb-create{background:var(--cs-navy,#08384F);color:#fff;border:none;border-radius:8px;padding:9px 22px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;transition:background .12s}
.mb-create:hover{background:var(--cs-blue,#006F9A)}
@media(max-width:600px){
  .modal{width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;padding:22px 18px}
  .modal-bg{align-items:flex-end;padding:0}
  .mrow input,.mrow select{font-size:16px}
  .mbtns{flex-direction:column-reverse}
  .mbtns button{width:100%;padding:13px}
}


/* ═══════════════════ DASHBOARD POLISH v2 — tighter · brighter · crisp ═══════════════════ */
:root{
  --pol-border:#E1E6EC;
  --pol-border-strong:#CFD7E0;
  --pol-shadow:0 1px 2px rgba(16,40,64,.04), 0 3px 10px rgba(16,40,64,.05);
  --pol-shadow-hover:0 2px 6px rgba(16,40,64,.06), 0 12px 26px rgba(16,40,64,.12);
  --pol-blue:#0070F2;
  --pol-teal:#00A9A4;
}

/* Brighter page — a cleaner near-white instead of flat gray */
body{background:#F4F6F8}

/* ── Section rhythm & headers ── */
#developer-view .block-head,#developer-view .widgets-head,#developer-view .sec-head{margin-top:32px}
#developer-view > .block-head:first-of-type{margin-top:22px}
.block-title{letter-spacing:-.2px;position:relative;padding-left:12px}
.block-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,var(--pol-blue),var(--pol-teal))}
.block-sub{color:var(--sap-ink-2)}
.block-head .view-all{align-self:center;white-space:nowrap;font-weight:600}
.dash-welcome{letter-spacing:-.6px}

/* ── Applications: grouped card, tighter ── */
#developer-view .platform-map{margin-top:12px}
.pm-col.wide{background:#fff;border:1px solid var(--pol-border);border-radius:16px;padding:18px;
  box-shadow:var(--pol-shadow)}
.pm-col.wide .pm-grid{margin:0;gap:14px}

/* ── Overview strip (Sites Under Control row): tighter, brighter numbers ── */
.ov-strip{border:1px solid var(--pol-border) !important;box-shadow:var(--pol-shadow) !important;
  border-radius:16px !important;padding:20px 8px !important}
.ov-val{font-size:34px !important;font-weight:600 !important;letter-spacing:-1.2px;
  background:linear-gradient(180deg,#0F2733,#33475B);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.ov-label{font-size:12px;margin-top:6px}

/* ── KPI cards: tighter, crisper, subtle color accent, hover lift ── */
.kpi-grid{gap:14px}
.kpi{border:1px solid var(--pol-border) !important;border-radius:14px !important;
  padding:15px 16px !important;box-shadow:var(--pol-shadow) !important;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--pol-shadow-hover) !important;
  border-color:var(--pol-border-strong) !important}
.kpi::before{width:3px !important;opacity:1 !important;border-radius:14px 0 0 14px}
.kpi-label{font-size:10.5px !important;letter-spacing:.5px;min-height:24px !important;color:var(--sap-ink-2) !important}
.kpi-val{font-size:23px !important;letter-spacing:-.6px;margin-top:4px !important}

/* ── Widget cards + pipeline + tables: unified soft depth + hover ── */
.wg-card,.pipeline,.table-wrap,.th-card,.pp-dev-card,.actions-panel{
  border:1px solid var(--pol-border) !important;box-shadow:var(--pol-shadow) !important}
.wg-card,.pp-dev-card{transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.wg-card:hover,.pp-dev-card:hover{transform:translateY(-2px);
  box-shadow:var(--pol-shadow-hover) !important;border-color:var(--pol-border-strong) !important}
.wg-card{min-height:280px !important}

/* Pipeline: a touch tighter */
.pipeline{padding:20px !important}
.pipe-stage.filled .pipe-dot,.pipe-stage.submitted .pipe-dot,.pipe-stage.online .pipe-dot{
  box-shadow:0 0 0 4px rgba(0,112,242,.12),0 1px 3px rgba(16,40,64,.18)}

/* ── Quick Access tiles: brighter, crisp, hover ── */
.quick-link{border:1px solid var(--pol-border) !important;box-shadow:var(--pol-shadow) !important;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.quick-link:hover{transform:translateY(-2px);box-shadow:var(--pol-shadow-hover) !important;
  border-color:var(--pol-blue) !important}
.ql-icon{color:var(--pol-blue)}

/* ── Portfolio table: cleaner rows ── */
.ptable thead th{background:#F6F8FA !important;letter-spacing:.4px;color:var(--sap-ink-2) !important}
.ptable tbody tr{transition:background .12s ease}
.ptable tbody tr:hover{background:#F2F7FF !important}
.ptable tbody td{border-bottom:1px solid #EDF0F4 !important}

/* Application tiles inside the dashboard grid: crisp + hover lift */
.pm-tile{transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.pm-tile:hover{transform:translateY(-2px);box-shadow:var(--pol-shadow-hover) !important}

/* Ownership banner ("5 projects have no owner"): softer, brighter */
.owner-banner,.assign-banner{border-radius:12px !important}

/* Toggle buttons crisper */
.block-toggle{box-shadow:var(--pol-shadow) !important;border-color:var(--pol-border) !important}
.block-toggle:hover{border-color:var(--pol-blue) !important}
/* ══════════════════════ MOBILE ══════════════════════ */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}

/* ── AUTH SCREEN ── */
@media (max-width:520px){
  #auth-screen{align-items:flex-start;padding:24px 14px 40px;min-height:100vh;min-height:100dvh;overflow-y:auto}
  .auth-card{width:100%;max-width:none;padding:34px 22px;border-radius:16px}
  .auth-logo img{height:44px !important}
  .auth-company{font-size:19px}
  .auth-sub{font-size:12.5px;margin-bottom:24px}
  .auth-field input{font-size:16px;padding:13px 14px}
  .btn-email,.btn-google{padding:15px 18px;font-size:15px}

}

/* Drawer-only controls (name + Account/Sign-out) hidden on desktop; shown inside the mobile drawer via the max-width:900px block below. */

  .tb-burger{display:flex}

  .tb-client-chip{height:30px;padding:3px 7px;max-width:150px;overflow:hidden}

    background:#ffffff !important;background-color:#ffffff !important;
    flex-direction:column;align-items:stretch;gap:0;margin:0;padding:64px 0 20px;
    box-shadow:-8px 0 30px rgba(0,0,0,.28);transform:translateX(100%);transition:transform .24s ease;
    z-index:1000 !important;overflow-y:auto;-webkit-overflow-scrolling:touch;

  .tb-nav.open{transform:translateX(0)}
  .tb-tab{height:auto;padding:15px 22px;border-bottom:1px solid var(--sap-bar-border);

  .tb-tab.active{border-bottom-color:var(--sap-bar-border);border-left-color:var(--sap-blue);

  .tb-tab svg{width:18px;height:18px}
  .tb-nav .tb-drawer-actions{padding:16px 22px;display:flex;flex-direction:column;gap:10px}

    word-break:break-all;border-bottom:1px solid var(--sap-bar-border);margin-bottom:14px}

}

/* ── LAYOUT / CONTENT ── */
@media (max-width:900px){
  #main{padding:22px 14px 56px}
  .dash-welcome{font-size:24px}
  .dash-sub{font-size:13.5px}
  .dash-positioning{font-size:12px}
  .block-head{flex-direction:column;align-items:flex-start;gap:10px;margin:26px 0 12px}
  .widgets-head .block-title{font-size:19px}

<style>
#omega-boot{position:fixed;inset:0;z-index:2147483000;background:#0B1E35;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;

#omega-boot.hide{opacity:0;pointer-events:none}
#omega-boot .ob-mark{width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,#006F9A,#00A9A4);
  display:flex;align-items:center;justify-content:center;

#omega-boot .ob-txt{color:#8CA3BE;font:500 13px/1 'DM Sans',sans-serif;letter-spacing:.3px}
@keyframes ob-spin{to{transform:rotate(360deg)}}
/* Failsafe: never let the loader trap the user if JS fails to dismiss it. */
#omega-boot{animation:ob-failsafe 0s linear 8s forwards}
@keyframes ob-failsafe{to{opacity:0;pointer-events:none;visibility:hidden}}

<div id="omega-boot" role="status" aria-label="Loading">

<script>
/* Dismiss the boot loader. Called once auth state is known (from the first
   onAuthStateChanged callback), so the screen underneath is already the
   correct one — app, login, or a pending redirect — and never flashes. */
window._omegaReady = function(){
  var el = document.getElementById('omega-boot');
  if (!el || el.classList.contains('hide')) return;
  el.classList.add('hide');
  setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 320);
};
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script>
const CFG = window.CLEARSKY_CONFIG;
firebase.initializeApp(CFG.firebase);
const auth = firebase.auth();
const db = firebase.firestore();
let allProjects = [];
let myEmail = '';

// OMEGA sales-demo workspace: data is scoped by orgId (enforced by Firestore rules),
// NOT by uid — so the whole company sees its shared project portfolio.
// Brand fields (clientName/accountTier/logo) feed the shared OMEGA topbar; when
// window.OMEGA_WORKSPACE is present it overrides these. Per-tenant: swap the
// fallback values below to match the tenant (same as the index WORKSPACES entry).
const WS = window.OMEGA_WORKSPACE || {
  orgId:'nextnrg.com', allowedDomain:'nextnrg.com',
  clientName:'NextNRG', accountTier:'Enterprise'
};
function domainOf(email){ return (email||'').split('@')[1] || ''; }

function esc2(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function signOut(){ auth.signOut().then(function(){ window.location.href='/'; }); }

/* Paint the shared OMEGA topbar (client chip, tier badge, avatar, name) so this
   page matches the portal index and marketplace exactly. */
function paintTopbar(user){
  var chip = document.getElementById('tb-client-chip');
  if (chip){ chip.innerHTML = WS.logo
      ? '<img src="'+esc2(WS.logo)+'" alt="" onerror="this.parentNode.innerHTML=\'<span class=&quot;tb-client-txt&quot;>'+esc2(WS.clientName||'')+'</span>\'">'
      : '<span class="tb-client-txt">'+esc2(WS.clientName||'')+'</span>'; }
  var badge = document.getElementById('tb-ent-badge');
  if (badge) badge.textContent = (WS.accountTier||'Account') + ' Account';
  // Show a sensible name immediately (displayName or email), then upgrade to the
  // saved profile name once it loads — same source of truth as the portal index.
  _paintName((user && user.displayName) || (user && user.email) || '', user);
  var av = document.getElementById('tb-avatar');
  if (av) av.textContent = ((user && user.email) || '?').charAt(0).toUpperCase();
  _resolveDisplayName(user);
}
function _paintName(name, user){
  var el = document.getElementById('tb-name');
  if (el) el.textContent = name || (user && user.email) || '';
}
/* Look up the display name saved in the team_members profile
   (doc id = "<orgId>__<email>"), matching how the portal index resolves it.
   Falls back to Firebase displayName, then email. */
function _resolveDisplayName(user){
  if (!user || !db) return;
  try {
    var id = WS.orgId + '__' + (user.email||'').toLowerCase();
    db.collection('team_members').doc(id).get().then(function(doc){
      var nm = (doc && doc.exists && doc.data() && doc.data().name) ? doc.data().name : '';
      if (!nm) nm = user.displayName || user.email || '';
      _paintName(nm, user);
      var av = document.getElementById('tb-avatar');
      if (av && nm) av.textContent = nm.charAt(0).toUpperCase();
    })['catch'](function(){ /* keep the email fallback already painted */ });
  } catch(e){ /* ignore — email fallback stands */ }
}

auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = '/'; return; }
  if (window._omegaReady) window._omegaReady();
  myEmail = (user.email || '').toLowerCase();
  paintTopbar(user);
  // Only accounts on this workspace's domain may view its projects.
  if (WS.allowedDomain && domainOf(user.email) !== WS.allowedDomain) {
    document.getElementById('proj-table').innerHTML =
      '<div class="empty"><p>This is the NextNRG workspace. Sign in with your @' +
      WS.allowedDomain + ' account to view projects.</p></div>';
    document.getElementById('proj-sub').textContent = 'Access restricted to @' + WS.allowedDomain;
    return;
  }
  loadProjects();
});

async function loadProjects() {
  try {
    // Scope by orgId → matches Firestore security rules and the dashboard.
    const snap = await db.collection('projects').where('orgId','==',WS.orgId).get();
    allProjects = snap.docs.map(d => ({id:d.id,...d.data()}));
    // Sort newest-first client-side (avoids needing a composite index).
    allProjects.sort((a,b)=>{
      const ta = a.updatedAt?.toDate?.()?.getTime() || 0;
      const tb = b.updatedAt?.toDate?.()?.getTime() || 0;
      return tb - ta;
    });
    document.getElementById('proj-sub').textContent = allProjects.length + ' project(s) total';
    renderTable();
  } catch(e) {
    document.getElementById('proj-table').innerHTML = `<div class="empty"><p>Error: ${e.message}</p></div>`;
  }
}

function filterProjects() {
  renderTable();
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  let filtered = allProjects.filter(p => {
    if (!q) return true;
    const owner = ((p.ownerName||'') + ' ' + (p.ownerEmail||p.createdBy||'')).toLowerCase();
    return (p.name||'').toLowerCase().includes(q)
        || (p.address||'').toLowerCase().includes(q)
        || owner.includes(q);
  });
  if (sort === 'mine') filtered = filtered.filter(p => (p.ownerEmail||p.createdBy||'').toLowerCase() === myEmail);

  if (sort === 'name') filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if (sort === 'created') filtered.sort((a,b)=>{
    const ta = a.createdAt?.toDate?.()?.getTime()|| 0;
    const tb = b.createdAt?.toDate?.()?.getTime()|| 0;
    return tb - ta;
  });

  const table = document.getElementById('proj-table');
  if (!filtered.length) {
    table.innerHTML = `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><p>No projects found.</p></div>`;
    return;
  }

  table.innerHTML = `
    <div class="pt-head"><span>Project</span><span>Owner</span><span>Type</span><span>Updated</span><span></span></div>
    ${filtered.map(p => {
      const date = p.updatedAt?.toDate ? p.updatedAt.toDate().toLocaleDateString() : '—';
      return `<div class="pt-row" onclick="openProject('${p.id}')">
        <div><div class="pt-name">${esc(p.name||'Untitled')}</div><div class="pt-addr">${esc(p.address||'—')}</div></div>
        <div>${ownerCell(p)}</div>
        <div><span class="pt-type">${esc(p.type||'BESS')}</span></div>
        <div class="pt-date">${date}</div>
        <div><button class="pt-del" onclick="event.stopPropagation();deleteProject('${p.id}','${esc(p.name||'Untitled')}')">🗑</button></div>
      </div>`;
    }).join('')}`;
}

/* Resolve the person tied to a project: ownerEmail/ownerName on newer docs,
   or the legacy `createdBy`/`ownerName`. Renders an owner chip matching the
   portal index (teal = you, amber = unassigned) plus a mailto link so the row
   links to whoever created/owns it. */
function ownerCell(p) {
  const email = (p.ownerEmail || p.createdBy || '').toLowerCase();
  const name  = p.ownerName || (email ? email.split('@')[0] : '');
  if (!email && !name) {
    return `<span class="owner-chip owner-none">Unassigned</span>`;
  }
  const isMe = email && email === myEmail;
  const cls  = isMe ? 'owner-chip owner-me' : 'owner-chip';
  const label = esc(name || '—') + (isMe ? ' (you)' : '');
  const chip = `<span class="${cls}" title="${esc(email||name)}">${label}</span>`;
  const link = email
    ? `<a class="pt-owner-link" href="mailto:${esc(email)}" title="Email ${esc(email)}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></a>`
    : '';
  return `<div class="pt-owner">${chip}${link}</div>`;
}

function openProject(id) { window.location.href = '/editor.html?id='+id; }

async function deleteProject(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  try {
    await db.collection('projects').doc(id).delete();
    allProjects = allProjects.filter(p => p.id !== id);
    renderTable();
  } catch (err) {
    console.error('Delete failed:', err);
    var code = (err && err.code) ? err.code : '';
    if (code === 'permission-denied') {
      alert('Delete blocked by Firestore security rules.\n\nThis usually means the project is missing an "orgId" field (older projects) or its orgId does not match your account. Open + re-save the project to stamp orgId, or update the delete rule.\n\nTechnical: ' + err.message);
    } else {
      alert('Could not delete "' + name + '".\n\n' + (err && err.message ? err.message : err));
    }
  }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
<script>
/* ══ MOBILE NAV DRAWER ══ */
(function(){
  function build(){
    var bar = document.getElementById('topbar'),
        nav = document.querySelector('.tb-nav');
    if(!bar || !nav || document.getElementById('tb-burger')) return;

    var b = document.createElement('button');
    b.id = 'tb-burger'; b.className = 'tb-burger';
    b.setAttribute('aria-label','Menu'); b.setAttribute('aria-expanded','false');
    b.innerHTML = '<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/>'+
                  '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
    bar.appendChild(b);

    var s = document.createElement('div');
    s.className = 'tb-scrim'; s.id = 'tb-scrim';
    document.body.appendChild(s);

    // Remember the nav's original home + position inside #topbar so we can
    // restore it exactly on desktop. On mobile we move it onto document.body so its
    // position:fixed isn't trapped by the sticky topbar's stacking context.
    var navHome = nav.parentNode, navNext = nav.nextSibling;

    // Reparent + inline background depending on viewport width.
    //  ≤900px  → drawer: fixed, on document.body, solid white
    //  >900px  → inline nav row: back in #topbar, in its original slot
    function place(){
      var mobile = window.innerWidth <= 900;
      if (mobile){
        if (nav.parentNode !== document.body) document.body.appendChild(nav);
        nav.style.backgroundColor = '#ffffff';
        nav.style.opacity = '1';
      } else {
        closeNav();
        if (nav.parentNode !== navHome){
          if (navNext && navNext.parentNode === navHome) navHome.insertBefore(nav, navNext);
          else navHome.appendChild(nav);
        }
        nav.style.backgroundColor = '';
        nav.style.opacity = '';
      }
    }
    place();
    window.addEventListener('resize', place);

    var who = document.createElement('div');
    who.className = 'tb-drawer-who'; who.id = 'tb-drawer-who';
    var acts = document.createElement('div');
    acts.className = 'tb-drawer-actions';
    var html = '';
    if (typeof openAccount === 'function'){
      html += '<button class="btn-signout" onclick="closeNav();openAccount()">Account settings</button>';
    }
    html += '<button class="btn-signout" onclick="closeNav();signOut()">Sign out</button>';
    acts.innerHTML = html;
    nav.insertBefore(who, nav.firstChild);
    nav.appendChild(acts);

    b.addEventListener('click', toggleNav);
    s.addEventListener('click', closeNav);
    nav.addEventListener('click', function(e){
      if(e.target.closest && e.target.closest('.tb-tab')) closeNav();
    });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNav(); });
  }

  window.toggleNav = function(){
    var n=document.querySelector('.tb-nav'), s=document.getElementById('tb-scrim'),
        b=document.getElementById('tb-burger');
    if(!n) return;
    var open = n.classList.toggle('open');
    if(s) s.classList.toggle('open', open);
    if(b) b.setAttribute('aria-expanded', open?'true':'false');
    document.body.style.overflow = open ? 'hidden' : '';
    var who=document.getElementById('tb-drawer-who'), tn=document.getElementById('tb-name');
    if(who && tn) who.textContent = tn.textContent || '';
  };
  window.closeNav = function(){
    var n=document.querySelector('.tb-nav'), s=document.getElementById('tb-scrim'),
        b=document.getElementById('tb-burger');
    if(n) n.classList.remove('open');
    if(s) s.classList.remove('open');
    if(b) b.setAttribute('aria-expanded','false');
    document.body.style.overflow='';
  };

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>

<script>
/* ══ NEW PROJECT (projects page) — create doc, jump straight to the BESS SiteMap editor ══ */
function openNewProjectModal(type){
  var sel = document.getElementById('np-type');
  if (sel && type) sel.value = type;
  document.getElementById('new-proj-modal').classList.add('on');
  setTimeout(function(){ var n=document.getElementById('np-name'); if(n) n.focus(); }, 80);
}
function closeNewProjectModal(){
  document.getElementById('new-proj-modal').classList.remove('on');
}
async function createProject(){
  var name = (document.getElementById('np-name').value||'').trim();
  var addr = (document.getElementById('np-addr').value||'').trim();
  var type = document.getElementById('np-type').value;
  var client = (document.getElementById('np-client').value||'').trim();
  if (!name){ alert('Please enter a project name.'); return; }
  var user = (auth && auth.currentUser) || null;
  if (!user){ alert('You need to be signed in.'); return; }
  try {
    var ownerName = (window._projMeName && _projMeName()) || (user.displayName || (user.email||'').split('@')[0]);
    var ref = await db.collection('projects').add({
      uid: user.uid,
      orgId: WS.orgId,
      ownerEmail: (user.email||'').toLowerCase(),
      ownerName: ownerName,
      name: name, address: addr, type: type, client: client,
      stage: 'candidate',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      elements: [], conduits: [], bessList: [], annotations: []
    });
    closeNewProjectModal();
    // Straight into the BESS SiteMap editor, branded for this tenant.
    var slug = (WS.allowedDomain) ? String(WS.allowedDomain).split('.')[0] : '';
    var url = '/editor.html?id=' + encodeURIComponent(ref.id);
    if (slug) url += '&org=' + encodeURIComponent(slug);
    window.location.href = url;
  } catch(e){
    alert('Error creating project: ' + e.message);
  }
}

</script>
